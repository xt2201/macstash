  <g transform="translate(300, 520)">
    <rect x="0" y="0" width="600" height="58" rx="18" fill="#0F141F" fill-opacity="0.94" stroke="#34C759" stroke-opacity="0.45" stroke-width="1.2"/>
    <rect x="12" y="10" width="96" height="38" rx="11" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="60" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11.5" font-weight="700" fill="#FFFFFF">09:41:22</text>
    <text x="60" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#00D2FF">Flip Clock</text>

    <rect x="116" y="10" width="110" height="38" rx="11" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="171" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">CPU 14% · RAM 52%</text>
    <text x="171" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#30D158">System Stats</text>

    <rect x="234" y="10" width="84" height="38" rx="11" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="276" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#FFD60A">24C Clear</text>
    <text x="276" y="40" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#AEAEB2">Weather</text>

    <line x1="330" y1="14" x2="330" y2="44" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

    <rect x="342" y="13" width="30" height="30" rx="8" fill="#0A84FF"/>
    <circle cx="357" cy="48" r="2.5" fill="#FFFFFF"/>

    <rect x="380" y="13" width="30" height="30" rx="8" fill="#30D158"/>
    <circle cx="395" cy="48" r="2.5" fill="#FFFFFF"/>

    <rect x="418" y="13" width="30" height="30" rx="8" fill="#BF5AF2"/>
    <rect x="456" y="13" width="30" height="30" rx="8" fill="#FF9F0A"/>

    <rect x="498" y="12" width="90" height="34" rx="10" fill="#34C759" fill-opacity="0.16" stroke="#34C759" stroke-opacity="0.4"/>
    <text x="543" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#30D158">SECOND DOCK</text>
    <text x="543" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="600" fill="#FFFFFF">16 Live Widgets</text>
