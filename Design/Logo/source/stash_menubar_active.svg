<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <!-- MacStash Menu Bar Template Icon (Active State / Pomodoro Running) -->
  <!-- Features filled solid dial sector for immediate visual recognition in status bar -->
  <g fill="#000000" stroke="#000000">
    <!-- Anchor Pin at bottom-left (2.5, 15.5) with collar ring -->
    <circle cx="2.5" cy="15.5" r="2.2" stroke="none" />

    <!-- Inactive Track Guide Arc (Radius 12.0) -->
    <path d="M 2.5 3.5 A 12 12 0 0 1 14.5 15.5"
          fill="none" stroke-width="1.0" stroke-opacity="0.35" stroke-linecap="round" />

    <!-- Active Filled Sector (Outer R: 12.5, Inner R: 6.5, sweeps 55 deg) -->
    <!-- Arc outer from (2.5, 3.0) to (9.7, 5.2), Arc inner from (6.4, 9.9) to (2.5, 9.0) -->
    <path d="M 2.5 3.0
             A 12.5 12.5 0 0 1 10.5 5.8
             L 6.7 10.4
             A 6.5 6.5 0 0 0 2.5 9.0
             Z"
          stroke="none" />

    <!-- Active Focal Pip at 45 deg -->
    <circle cx="9.2" cy="8.8" r="1.1" fill="#FFFFFF" stroke="#000000" stroke-width="0.8" />
  </g>
</svg>
