<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" width="1024" height="320">
  <defs>
    <!-- Background Gradient for Light Lockup -->
    <linearGradient id="lockupLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F5F7" />
    </linearGradient>

    <!-- Dial Gradient -->
    <linearGradient id="lockupDialLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="320" rx="32" fill="url(#lockupLightBg)" stroke="#E5E5EA" stroke-width="2" />

  <!-- STANDALONE MARK (Scales 1024 down to 240x240, placed at x=48, y=40) -->
  <g transform="translate(48, 40) scale(0.234375)">
    <!-- Outer Inactive Channel Arc -->
    <path d="M 180 284 A 560 560 0 0 1 740 844"
          fill="none" stroke="#000000" stroke-opacity="0.12" stroke-width="44" stroke-linecap="round" />

    <!-- Concentric Inner Guideline Arc -->
    <path d="M 180 484 A 360 360 0 0 1 540 844"
          fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="14" stroke-linecap="round" />

    <!-- Mechanical Detents -->
    <g stroke="#000000" stroke-opacity="0.3" stroke-linecap="round">
      <line x1="180" y1="260" x2="180" y2="234" stroke-width="6" />
      <line x1="665" y1="564" x2="691" y2="549" stroke-width="5" />
      <line x1="576" y1="448" x2="604" y2="420" stroke-width="8" stroke="#0066CC" stroke-opacity="0.9" />
      <line x1="460" y1="360" x2="475" y2="334" stroke-width="5" />
      <line x1="764" y1="844" x2="790" y2="844" stroke-width="6" />
    </g>

    <!-- Active Sweeping Radial Sector -->
    <path d="M 180 284
             A 560 560 0 0 1 665 564
             L 492 664
             A 360 360 0 0 0 180 484
             Z"
          fill="url(#lockupDialLight)" />

    <!-- Focal Pip -->
    <circle cx="505" cy="519" r="30" fill="#FFFFFF" stroke="#0066CC" stroke-width="6" />
    <circle cx="505" cy="519" r="14" fill="#0066CC" />

    <!-- Anchor Origin Pin -->
    <circle cx="180" cy="844" r="124" fill="#FFFFFF" stroke="url(#lockupDialLight)" stroke-width="18" />
    <circle cx="180" cy="844" r="58" fill="#0066CC" />
    <circle cx="180" cy="844" r="24" fill="#FFFFFF" />
  </g>

  <!-- TYPOGRAPHY: "Stash" and "FOR macOS" -->
  <g transform="translate(328, 0)">
    <text x="0" y="172"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-size="118"
          font-weight="700"
          letter-spacing="-1.5"
          fill="#1C1C1E">Stash</text>

    <text x="6" y="222"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif"
          font-size="20"
          font-weight="600"
          letter-spacing="7"
          fill="#0066CC">FOR macOS</text>
  </g>
</svg>
