name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Universal DMG, Sign Sparkle Update, and Publish Release
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Run Domain Unit Tests
        run: make test

      - name: Build Universal Release Packages (DMG & Signed ZIP)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/build_dmg.sh --unsigned

      - name: Commit and Push Updated Appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update appcast.xml for ${{ github.ref_name }} [skip ci]" || true
            git fetch origin main || true
            git rebase origin/main || true
            git push origin HEAD:main || true
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.zip
            dist/*.zip.sha256
            appcast.xml
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
