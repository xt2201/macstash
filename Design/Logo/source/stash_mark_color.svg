<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="markDial" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <linearGradient id="markTrack" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- STANDALONE COLOR MARK (TRANSPARENT BACKGROUND) -->
  <!-- Centered / Normalized in 1024x1024 canvas -->
  <!-- Origin Vertex: (180, 844) -->
  <g id="mark-color">
    <!-- Outer Inactive Channel Arc (R=560) -->
    <path d="M 180 284 A 560 560 0 0 1 740 844"
          fill="none" stroke="url(#markTrack)" stroke-width="44" stroke-linecap="round" />

    <!-- Concentric Inner Guideline Arc (R=360) -->
    <path d="M 180 484 A 360 360 0 0 1 540 844"
          fill="none" stroke="#0A84FF" stroke-opacity="0.18" stroke-width="14" stroke-linecap="round" />

    <!-- Precision Mechanical Detents -->
    <g stroke="#00D2FF" stroke-linecap="round">
      <line x1="180" y1="260" x2="180" y2="234" stroke-width="6" stroke-opacity="0.6" />
      <line x1="665" y1="564" x2="691" y2="549" stroke-width="5" stroke-opacity="0.6" />
      <line x1="576" y1="448" x2="604" y2="420" stroke-width="8" stroke-opacity="0.9" />
      <line x1="460" y1="360" x2="475" y2="334" stroke-width="5" stroke-opacity="0.6" />
      <line x1="764" y1="844" x2="790" y2="844" stroke-width="6" stroke-opacity="0.6" />
    </g>

    <!-- Active Sweeping Radial Sector (R_out: 560, R_in: 360, 60 deg) -->
    <path d="M 180 284
             A 560 560 0 0 1 665 564
             L 492 664
             A 360 360 0 0 0 180 484
             Z"
          fill="url(#markDial)" />

    <!-- Focal Detent Pip (45 deg) -->
    <circle cx="505" cy="519" r="30" fill="#FFFFFF" />
    <circle cx="505" cy="519" r="15" fill="#0A84FF" />

    <!-- Anchor Origin Pin -->
    <circle cx="180" cy="844" r="124" fill="#0D0F14" stroke="url(#markDial)" stroke-width="18" />
    <circle cx="180" cy="844" r="58" fill="#00D2FF" />
    <circle cx="180" cy="844" r="24" fill="#FFFFFF" />
  </g>
</svg>
