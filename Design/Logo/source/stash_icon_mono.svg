<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- MONOCHROME SILHOUETTE FOR APPLE ICON COMPOSER / LIQUID GLASS TINTING -->
  <!-- Represents structural depth and opacity in pure white (#FFFFFF) with calibrated alpha levels -->
  <g id="mono-silhouette">
    <!-- Inactive Track (Subtle Frosted Base Depth: 25% white) -->
    <path d="M 160 304 A 560 560 0 0 1 720 864"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="40" stroke-linecap="round" />

    <path d="M 160 504 A 360 360 0 0 1 520 864"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="12" stroke-linecap="round" />

    <!-- Mechanical Detents (50% white) -->
    <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-linecap="round">
      <line x1="160" y1="280" x2="160" y2="254" stroke-width="6" />
      <line x1="645" y1="584" x2="671" y2="569" stroke-width="5" />
      <line x1="556" y1="468" x2="584" y2="440" stroke-width="8" stroke-opacity="0.8" />
      <line x1="440" y1="380" x2="455" y2="354" stroke-width="5" />
      <line x1="744" y1="864" x2="770" y2="864" stroke-width="6" />
    </g>

    <!-- Active Radial Gauge Sector (Prominent Top Glass Surface: 100% white) -->
    <path d="M 160 304
             A 560 560 0 0 1 645 584
             L 472 684
             A 360 360 0 0 0 160 504
             Z"
          fill="#FFFFFF" />

    <!-- Indicator Pip (100% white) -->
    <circle cx="485" cy="539" r="28" fill="#FFFFFF" />

    <!-- Corner Origin Pin Collar & Dot -->
    <circle cx="160" cy="864" r="120" fill="none" stroke="#FFFFFF" stroke-width="16" />
    <circle cx="160" cy="864" r="56" fill="#FFFFFF" />
  </g>
</svg>
