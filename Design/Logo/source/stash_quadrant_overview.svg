    <text x="41" y="61" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" fill="#98989D">14.2 MB · Ready</text>

    <rect x="10" y="75" width="114" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="18" y="83" width="16" height="16" rx="4" fill="#30D158" fill-opacity="0.8"/>
    <text x="41" y="90" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">Specs.pdf</text>
    <text x="41" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" fill="#98989D">Snippet · Pinned</text>

    <rect x="10" y="114" width="114" height="24" rx="7" fill="#FFFFFF" fill-opacity="0.04" stroke="#FF9F0A" stroke-opacity="0.25" stroke-dasharray="3 2"/>
    <text x="67" y="129" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" fill="#FFD60A">Drop or Paste Files</text>

    <text x="67" y="157" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#98989D">Shake Drag · Ctrl+Opt+S</text>
  </g>

  <!-- 6. RIGHT EDGE SLIDER + NOW PLAYING -->
  <g transform="translate(1038, 232)">
    <rect x="0" y="0" width="46" height="206" rx="23" fill="#0D1119" fill-opacity="0.92" stroke="#00D2FF" stroke-opacity="0.45" stroke-width="1.2"/>
    <rect x="18" y="14" width="10" height="96" rx="5" fill="#FFFFFF" fill-opacity="0.1"/>
    <rect x="18" y="44" width="10" height="66" rx="5" fill="url(#arcBri)"/>
    <circle cx="23" cy="44" r="7" fill="#FFFFFF"/>
    <text x="23" y="123" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#00D2FF">68%</text>

    <rect x="11" y="132" width="24" height="24" rx="6" fill="url(#arcVol)"/>
    <circle cx="23" cy="144" r="5" fill="#FFFFFF" fill-opacity="0.85"/>
    <g transform="translate(11, 164)" fill="#00D2FF">
      <rect x="0" y="6" width="3" height="10" rx="1.5"/>
      <rect x="5" y="1" width="3" height="15" rx="1.5"/>
      <rect x="10" y="4" width="3" height="12" rx="1.5"/>
      <rect x="15" y="0" width="3" height="16" rx="1.5"/>
      <rect x="20" y="5" width="3" height="11" rx="1.5"/>
    </g>
    <text x="23" y="194" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="700" fill="#AEAEB2">PLAY</text>
  </g>

  <!-- 7. CENTER-LEFT: CURSOR RADIAL PALETTE (Opt+Space) -->
  <g transform="translate(462, 336)">
    <circle cx="0" cy="0" r="92" fill="#0F141E" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.4" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="29" fill="#182032" stroke="#00D2FF" stroke-opacity="0.5" stroke-width="1"/>
    <!-- 4 Colored Arc Sectors -->
    <path d="M 0 -76 A 76 76 0 0 1 76 0" fill="none" stroke="#00D2FF" stroke-width="10" stroke-linecap="round"/>
    <path d="M 76 0 A 76 76 0 0 1 0 76" fill="none" stroke="#BF5AF2" stroke-width="10" stroke-linecap="round"/>
    <path d="M 0 76 A 76 76 0 0 1 -76 0" fill="none" stroke="#30D158" stroke-width="10" stroke-linecap="round"/>
    <path d="M -76 0 A 76 76 0 0 1 0 -76" fill="none" stroke="#FFD60A" stroke-width="10" stroke-linecap="round"/>

    <text x="0" y="-45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">BRIGHT</text>
    <text x="49" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">VOL</text>
    <text x="0" y="51" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">TIMER</text>
    <text x="-49" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">AWAKE</text>

    <text x="0" y="-2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="700" fill="#00D2FF">PALETTE</text>
    <text x="0" y="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="600" fill="#AEAEB2">Opt+Space</text>
  </g>

