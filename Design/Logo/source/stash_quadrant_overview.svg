    <text x="40" y="33" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">Backlight</text>
  </g>

  <g transform="translate(1100, 128)">
    <rect x="0" y="0" width="82" height="44" rx="9" fill="#00D2FF" fill-opacity="0.12" stroke="#00D2FF" stroke-opacity="0.35"/>
    <text x="41" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#00D2FF">TOP-RIGHT</text>
