<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="quadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161A24" />
      <stop offset="50%" stop-color="#0F121A" />
      <stop offset="100%" stop-color="#090B0F" />
    </linearGradient>

    <!-- Display Bezel Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A3040" />
      <stop offset="100%" stop-color="#181C26" />
    </linearGradient>

    <!-- Screen Glass Gradient -->
    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131720" />
      <stop offset="100%" stop-color="#0A0C12" />
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Amber Glow for Keyboard -->
    <linearGradient id="amberArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F0A" />
      <stop offset="100%" stop-color="#FFD60A" />
    </linearGradient>

    <!-- Emerald Glow for Pomodoro -->
    <linearGradient id="emeraldArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158" />
      <stop offset="100%" stop-color="#66D4CF" />
    </linearGradient>

    <!-- Violet Glow for Audio -->
    <linearGradient id="violetArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF5AF2" />
      <stop offset="100%" stop-color="#5E5CE6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" rx="24" fill="url(#quadBg)" />

  <!-- Ambient Backdrop Lights -->
  <circle cx="280" cy="180" r="180" fill="#FF9F0A" opacity="0.06" filter="blur(70px)" />
  <circle cx="920" cy="180" r="180" fill="#00D2FF" opacity="0.08" filter="blur(70px)" />
  <circle cx="280" cy="460" r="180" fill="#30D158" opacity="0.06" filter="blur(70px)" />
  <circle cx="920" cy="460" r="180" fill="#BF5AF2" opacity="0.07" filter="blur(70px)" />

  <!-- HEADER TITLE & BADGE -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="168" height="26" rx="6" fill="#0A84FF" fill-opacity="0.15" stroke="#0A84FF" stroke-opacity="0.35" stroke-width="1" />
    <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#00D2FF">FITTS'S LAW CORNERS</text>
    <text x="184" y="19" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Tactile Screen Quadrants &amp; Hidden Radial Controls</text>
  </g>

  <!-- MAIN MONITOR FRAME (Center x=600, y=340, width=980, height=500) -->
  <!-- Screen Bounds: x=110, y=100, width=980, height=480 -->
  <rect x="106" y="96" width="988" height="488" rx="20" fill="none" stroke="url(#bezelGrad)" stroke-width="8" />
  <rect x="110" y="100" width="980" height="480" rx="16" fill="url(#screenGlass)" />

  <!-- TOP MENU BAR SIMULATION -->
  <rect x="110" y="100" width="980" height="28" fill="#1C212D" fill-opacity="0.8" />
  <!-- Apple Logo & Menu Items -->
  <circle cx="132" cy="114" r="5" fill="#FFFFFF" fill-opacity="0.6" />
  <rect x="148" y="111" width="36" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.4" />
  <rect x="194" y="111" width="28" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.25" />
  <rect x="232" y="111" width="32" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.25" />
  <!-- Menu Bar Status Icons (Right) -->
  <rect x="1000" y="111" width="16" height="6" rx="2" fill="#FFFFFF" fill-opacity="0.3" />
  <rect x="1024" y="111" width="20" height="6" rx="2" fill="#00D2FF" fill-opacity="0.8" />
  <text x="1052" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#AEAEB2">9:41 AM</text>

  <!-- SCREEN CENTER SUBTLE WATERMARK -->
  <text x="600" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="700" letter-spacing="4" fill="#FFFFFF" fill-opacity="0.08">MacStash</text>
  <text x="600" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500" letter-spacing="1" fill="#FFFFFF" fill-opacity="0.12">ZERO-PIXEL HIT-ZONES · REAL-TIME HAPTICS</text>

  <!-- ==================== QUADRANT 1: TOP-LEFT (Keyboard Backlight) ==================== -->
  <g transform="translate(110, 128)">
    <!-- Dial Arc (Quadrant sweeping from 0 to 90 deg, R=110) -->
    <path d="M 0 110 A 110 110 0 0 0 110 0" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="12" />
    <path d="M 0 80 A 80 80 0 0 0 80 0" fill="none" stroke="url(#amberArc)" stroke-width="12" stroke-linecap="round" />
    <!-- Center Pivot Pin -->
    <circle cx="0" cy="0" r="22" fill="#191D26" stroke="url(#amberArc)" stroke-width="3" />
    <circle cx="0" cy="0" r="8" fill="#FFD60A" />
    <!-- Detent Ticks -->
    <line x1="0" y1="116" x2="0" y2="124" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" />
    <line x1="78" y1="78" x2="84" y2="84" stroke="#FFD60A" stroke-width="3" />
    <line x1="116" y1="0" x2="124" y2="0" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" />
  </g>
  <!-- Card Tag TL -->
  <g transform="translate(140, 160)">
    <rect x="0" y="0" width="180" height="52" rx="10" fill="#181D26" fill-opacity="0.85" stroke="#FF9F0A" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#FFD60A">TOP-LEFT DIAL</text>
    <text x="14" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Keyboard Backlight</text>
  </g>

  <!-- ==================== QUADRANT 2: TOP-RIGHT (Display Brightness) ==================== -->
  <g transform="translate(1090, 128)">
    <!-- Dial Arc (Quadrant sweeping from 90 to 180 deg, R=110) -->
    <path d="M 0 110 A 110 110 0 0 1 -110 0" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="12" />
    <path d="M 0 95 A 95 95 0 0 1 -95 0" fill="none" stroke="url(#cyanArc)" stroke-width="12" stroke-linecap="round" />
    <!-- Center Pivot Pin -->
    <circle cx="0" cy="0" r="22" fill="#191D26" stroke="url(#cyanArc)" stroke-width="3" />
    <circle cx="0" cy="0" r="8" fill="#00D2FF" />
    <!-- Detent Ticks -->
    <line x1="0" y1="116" x2="0" y2="124" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" />
    <line x1="-78" y1="78" x2="-84" y2="84" stroke="#00D2FF" stroke-width="3" />
    <line x1="-116" y1="0" x2="-124" y2="0" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" />
  </g>
  <!-- Card Tag TR -->
  <g transform="translate(880, 160)">
    <rect x="0" y="0" width="180" height="52" rx="10" fill="#181D26" fill-opacity="0.85" stroke="#00D2FF" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#00D2FF">TOP-RIGHT DIAL</text>
    <text x="14" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Hardware Brightness (DDC)</text>
  </g>

  <!-- ==================== QUADRANT 3: BOTTOM-LEFT (Pomodoro Timer) ==================== -->
  <g transform="translate(110, 580)">
    <!-- Dial Arc (Quadrant sweeping from 270 to 360 deg, R=110) -->
    <path d="M 0 -110 A 110 110 0 0 1 110 0" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="12" />
    <path d="M 0 -85 A 85 85 0 0 1 85 0" fill="none" stroke="url(#emeraldArc)" stroke-width="12" stroke-linecap="round" />
    <!-- Center Pivot Pin -->
    <circle cx="0" cy="0" r="22" fill="#191D26" stroke="url(#emeraldArc)" stroke-width="3" />
    <circle cx="0" cy="0" r="8" fill="#30D158" />
    <!-- Satellite Buttons Simulation -->
    <circle cx="50" cy="-20" r="10" fill="#242B38" stroke="#30D158" stroke-width="1.5" />
    <circle cx="20" cy="-50" r="10" fill="#242B38" stroke="#30D158" stroke-width="1.5" />
  </g>
  <!-- Card Tag BL -->
  <g transform="translate(140, 480)">
    <rect x="0" y="0" width="180" height="52" rx="10" fill="#181D26" fill-opacity="0.85" stroke="#30D158" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#30D158">BOTTOM-LEFT DIAL</text>
    <text x="14" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Pomodoro Focus Timer</text>
  </g>

  <!-- ==================== QUADRANT 4: BOTTOM-RIGHT (Master Volume & Device) ==================== -->
  <g transform="translate(1090, 580)">
    <!-- Dial Arc (Quadrant sweeping from 180 to 270 deg, R=110) -->
    <path d="M 0 -110 A 110 110 0 0 0 -110 0" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="12" />
    <path d="M 0 -75 A 75 75 0 0 0 -75 0" fill="none" stroke="url(#violetArc)" stroke-width="12" stroke-linecap="round" />
    <!-- Center Pivot Pin -->
    <circle cx="0" cy="0" r="22" fill="#191D26" stroke="url(#violetArc)" stroke-width="3" />
    <circle cx="0" cy="0" r="8" fill="#BF5AF2" />
  </g>
  <!-- Card Tag BR -->
  <g transform="translate(880, 480)">
    <rect x="0" y="0" width="180" height="52" rx="10" fill="#181D26" fill-opacity="0.85" stroke="#BF5AF2" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#BF5AF2">BOTTOM-RIGHT DIAL</text>
    <text x="14" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Master Audio &amp; Routing</text>
  </g>

  <!-- ==================== HIDDEN EDGE SLIDER DOCK SHELF (Right Edge) ==================== -->
  <g transform="translate(1068, 290)">
    <rect x="0" y="0" width="22" height="100" rx="11" fill="#202634" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
    <!-- Shelf Handle dots -->
    <circle cx="11" cy="40" r="2.5" fill="#FFFFFF" fill-opacity="0.6" />
    <circle cx="11" cy="50" r="2.5" fill="#FFFFFF" fill-opacity="0.6" />
    <circle cx="11" cy="60" r="2.5" fill="#FFFFFF" fill-opacity="0.6" />
  </g>
  <!-- Edge Shelf Callout Tag -->
  <g transform="translate(500, 480)">
    <rect x="0" y="0" width="200" height="44" rx="8" fill="#181D26" fill-opacity="0.8" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />
    <text x="14" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#AEAEB2">HIDDEN DOCK SHELF</text>
    <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">Border Slide-Out &amp; Launcher</text>
  </g>
</svg>
