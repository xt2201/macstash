    <rect x="10" y="10" width="54" height="16" rx="8" fill="#FF9F0A" fill-opacity="0.22"/>
    <text x="37" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="700" fill="#FF9F0A">STASH</text>
    <rect x="70" y="10" width="54" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="97" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#AEAEB2">NOTES</text>

    <!-- Stash Cards -->
    <rect x="10" y="36" width="114" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="18" y="44" width="16" height="16" rx="4" fill="#0A84FF" fill-opacity="0.8"/>
