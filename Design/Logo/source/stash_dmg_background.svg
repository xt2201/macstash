<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420">
  <defs>
    <!-- Background Gradient for DMG Installer Window -->
    <linearGradient id="dmgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191D26" />
      <stop offset="100%" stop-color="#0E1015" />
    </linearGradient>

    <!-- Arrow Accent Gradient -->
    <linearGradient id="dmgArrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="660" height="420" fill="url(#dmgBg)" />

  <!-- Subtle Precision Grid Pattern -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="660" y2="70" />
    <line x1="0" y1="350" x2="660" y2="350" />
    <line x1="330" y1="0" x2="330" y2="420" stroke-dasharray="6 6" />
  </g>

  <!-- Header Branding -->
  <g transform="translate(40, 42)">
    <text x="0" y="0"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
          font-size="22" font-weight="700" fill="#FFFFFF">MacStash</text>
    <text x="100" y="-1"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
          font-size="13" font-weight="500" fill="#8E8E93">Drag to Applications to Install</text>
  </g>

  <!-- Left: App Drop Zone Guide Ring -->
  <g transform="translate(180, 200)">
    <circle cx="0" cy="0" r="68" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6" />
    <text x="0" y="86" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
          font-size="12" font-weight="600" fill="#FFFFFF">MacStash</text>
  </g>

  <!-- Drag Action Gesture Arrow (Center) -->
  <g transform="translate(330, 200)">
    <!-- Animated-style guide line -->
    <line x1="-50" y1="0" x2="40" y2="0" stroke="url(#dmgArrow)" stroke-width="3" stroke-linecap="round" />
    <!-- Sleek Arrow Head -->
    <polygon points="48,0 34,-7 34,7" fill="#00D2FF" />
    <circle cx="-50" cy="0" r="3" fill="#0A84FF" />
  </g>

  <!-- Right: Applications Drop Zone Guide Ring -->
  <g transform="translate(480, 200)">
    <circle cx="0" cy="0" r="68" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6" />
    <text x="0" y="86" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
          font-size="12" font-weight="600" fill="#FFFFFF">Applications</text>
  </g>

  <!-- Footer Details -->
  <g transform="translate(0, 385)">
    <text x="330" y="0" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
          font-size="11" font-weight="400" fill="#636366">Tactile Corner Dials &amp; Multi-Display Controls for macOS</text>
  </g>
</svg>
