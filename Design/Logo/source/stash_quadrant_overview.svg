<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D13"/>
      <stop offset="100%" stop-color="#141925"/>
    </linearGradient>

    <linearGradient id="screenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131926"/>
      <stop offset="50%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#101521"/>
    </linearGradient>

    <linearGradient id="arcVol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF5AF2"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>

    <linearGradient id="arcBri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>

    <linearGradient id="arcPomo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158"/>
      <stop offset="100%" stop-color="#34C759"/>
    </linearGradient>

    <linearGradient id="arcKbd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A"/>
      <stop offset="100%" stop-color="#FF9F0A"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="640" fill="url(#bg)"/>

  <!-- Subtle Structural Grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="340" x2="1200" y2="340"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="640"/>
    <line x1="600" y1="0" x2="600" y2="640"/>
    <line x1="1000" y1="0" x2="1000" y2="640"/>
  </g>

  <!-- Header -->
  <g transform="translate(110, 34)">
    <rect x="0" y="0" width="186" height="28" rx="14" fill="#00D2FF" fill-opacity="0.14" stroke="#00D2FF" stroke-opacity="0.38"/>
    <text x="93" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#00D2FF">WORKSPACE ARCHITECTURE</text>
    <text x="204" y="20" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Corner Dials, Edge Sliders, Stash Shelf &amp; Second Dock</text>
  </g>

  <!-- Simulated macOS Display Frame -->
  <rect x="110" y="88" width="980" height="504" rx="22" fill="url(#screenBg)" stroke="#38445C" stroke-width="2"/>

  <!-- Screen Menu Bar & Notch -->
  <path d="M 132 88 L 1068 88 Q 1090 88 1090 110 L 1090 118 L 110 118 L 110 110 Q 110 88 132 88 Z" fill="#000000" fill-opacity="0.46"/>
  <rect x="556" y="88" width="88" height="22" rx="8" fill="#080A0F"/>

  <!-- Left Menu Bar Items (shifted right of Top-Left Dial) -->
  <text x="266" y="107" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#D1D1D6">Finder   File   Edit   View</text>

  <!-- Right Menu Bar MacStash Status Item + Pomodoro Readout (shifted left of Top-Right Dial) -->
  <g transform="translate(836, 94)">
    <rect x="0" y="0" width="94" height="18" rx="9" fill="#0A84FF" fill-opacity="0.22" stroke="#00D2FF" stroke-opacity="0.5" stroke-width="0.9"/>
    <circle cx="11" cy="9" r="4" fill="#00D2FF"/>
    <text x="21" y="12.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">24:15</text>
    <text x="58" y="12.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#AEAEB2">9:41</text>
  </g>

  <!-- Center-Right Clean Brand Watermark & Mini Control Card -->
  <g transform="translate(730, 314)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.16">MacStash</text>
    <text x="0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#00D2FF" fill-opacity="0.32">LIQUID GLASS CONTROL CENTER</text>
  </g>

  <!-- 1. TOP-LEFT CORNER: Keyboard Backlight -->
  <g transform="translate(110, 88)">
    <path d="M 0 0 L 138 0 A 138 138 0 0 1 0 138 Z" fill="#0F141E" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
    <path d="M 106 8 A 98 98 0 0 1 8 106" fill="none" stroke="url(#arcKbd)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="8" cy="106" r="7" fill="#FFFFFF"/>
    <circle cx="46" cy="46" r="19" fill="#1E2534" stroke="#FFD60A" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="46" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFD60A">75%</text>
  </g>

  <!-- 2. TOP-RIGHT CORNER: Hardware Brightness -->
  <g transform="translate(1090, 88)">
    <path d="M 0 0 L -138 0 A 138 138 0 0 0 0 138 Z" fill="#0F141E" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
    <path d="M -106 8 A 98 98 0 0 0 -8 106" fill="none" stroke="url(#arcBri)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="-8" cy="106" r="7" fill="#FFFFFF"/>
    <circle cx="-46" cy="46" r="19" fill="#1E2534" stroke="#00D2FF" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="-46" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00D2FF">85%</text>
  </g>

  <!-- 3. BOTTOM-LEFT CORNER: Pomodoro Timer -->
  <g transform="translate(110, 592)">
    <path d="M 0 0 L 138 0 A 138 138 0 0 0 0 -138 Z" fill="#0F141E" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
    <path d="M 8 -106 A 98 98 0 0 1 106 -8" fill="none" stroke="url(#arcPomo)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="106" cy="-8" r="7" fill="#FFFFFF"/>
    <circle cx="46" cy="-46" r="20" fill="#1E2534" stroke="#30D158" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="46" y="-42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#30D158">24:15</text>
  </g>

  <!-- 4. BOTTOM-RIGHT CORNER: Master Audio Volume -->
  <g transform="translate(1090, 592)">
    <path d="M 0 0 L -138 0 A 138 138 0 0 1 0 -138 Z" fill="#0F141E" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2"/>
    <path d="M -8 -106 A 98 98 0 0 0 -106 -8" fill="none" stroke="url(#arcVol)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="-106" cy="-8" r="7" fill="#FFFFFF"/>
    <circle cx="-46" cy="-46" r="19" fill="#1E2534" stroke="#BF5AF2" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="-46" y="-42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#BF5AF2">65%</text>
