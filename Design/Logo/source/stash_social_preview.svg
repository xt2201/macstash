<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="socialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161A24" />
      <stop offset="50%" stop-color="#0E1117" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <linearGradient id="socialGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <linearGradient id="containerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222837" />
      <stop offset="100%" stop-color="#12151E" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="640" fill="url(#socialBg)" />

  <!-- Background Ambient Glow -->
  <circle cx="340" cy="320" r="300" fill="#0A84FF" opacity="0.14" filter="blur(90px)" />
  <circle cx="1000" cy="240" r="240" fill="#00D2FF" opacity="0.08" filter="blur(110px)" />

  <!-- Subtle Corner Grid Lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="640" />
    <line x1="1200" y1="0" x2="1200" y2="640" />
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="560" x2="1280" y2="560" />
  </g>

  <!-- LEFT: APP ICON SQUIRCLE HERO (Size 360x360 placed at x=130, y=140) -->
  <g transform="translate(130, 140)">
    <!-- Squircle container -->
    <rect width="360" height="360" rx="80" fill="url(#containerGrad)" stroke="url(#borderGrad)" stroke-width="2" />

    <!-- Scaled Vector Artwork (360 / 1024 = 0.35156) -->
    <g transform="scale(0.35156)">
      <!-- Outer Inactive Channel Arc -->
      <path d="M 160 304 A 560 560 0 0 1 720 864"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="40" stroke-linecap="round" />

      <!-- Concentric Inner Guideline Arc -->
      <path d="M 160 504 A 360 360 0 0 1 520 864"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="12" stroke-linecap="round" />

      <!-- Detents -->
      <g stroke="#FFFFFF" stroke-opacity="0.45" stroke-linecap="round">
        <line x1="160" y1="280" x2="160" y2="254" stroke-width="6" />
        <line x1="645" y1="584" x2="671" y2="569" stroke-width="5" />
        <line x1="556" y1="468" x2="584" y2="440" stroke-width="8" stroke="#00D2FF" stroke-opacity="0.9" />
        <line x1="440" y1="380" x2="455" y2="354" stroke-width="5" />
        <line x1="744" y1="864" x2="770" y2="864" stroke-width="6" />
      </g>

      <!-- Active Sweeping Sector -->
      <path d="M 160 304
               A 560 560 0 0 1 645 584
               L 472 684
               A 360 360 0 0 0 160 504
               Z"
            fill="url(#socialGlow)" />

      <!-- Focal Pip -->
      <circle cx="485" cy="539" r="28" fill="#FFFFFF" />
      <circle cx="485" cy="539" r="14" fill="#0A84FF" />

      <!-- Anchor Pin -->
      <circle cx="160" cy="864" r="120" fill="#0D0F14" stroke="url(#socialGlow)" stroke-width="16" />
      <circle cx="160" cy="864" r="56" fill="#00D2FF" />
      <circle cx="160" cy="864" r="24" fill="#FFFFFF" />
    </g>
  </g>

  <!-- RIGHT: BRAND TYPOGRAPHY & VALUE PROPOSITION -->
  <g transform="translate(560, 155)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="168" height="30" rx="8" fill="#0A84FF" fill-opacity="0.18" stroke="#0A84FF" stroke-opacity="0.45" stroke-width="1" />
    <text x="14" y="20"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
          font-size="11" font-weight="700" letter-spacing="2.2" fill="#00D2FF">macOS UTILITY</text>

    <!-- Master App Name -->
    <text x="0" y="98"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
          font-size="78" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">MacStash</text>

    <!-- Tagline -->
    <text x="2" y="144"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
          font-size="22" font-weight="500" fill="#98989D">Tactile Corner Dials &amp; Hidden Controls</text>

    <!-- Subtitle / Value Proposition -->
    <text x="2" y="194"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
          font-size="15" font-weight="400" fill="#AEAEB2">Zero-pixel Fitts's law hot corners, multi-monitor hardware</text>
    <text x="2" y="220"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
          font-size="15" font-weight="400" fill="#AEAEB2">brightness, tactile master volume, and Pomodoro focus timer.</text>

    <!-- Key Pills -->
    <g transform="translate(0, 262)">
      <rect x="0" y="0" width="128" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
      <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#F5F5F7">Hot Corners</text>

      <rect x="140" y="0" width="176" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
      <text x="16" y="21" transform="translate(140, 0)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#F5F5F7">Hardware Brightness</text>

      <rect x="328" y="0" width="138" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
      <text x="18" y="21" transform="translate(328, 0)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#F5F5F7">Pomodoro Dial</text>

      <rect x="478" y="0" width="144" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
      <text x="18" y="21" transform="translate(478, 0)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#F5F5F7">Master Volume</text>
    </g>
  </g>
</svg>
