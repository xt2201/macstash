<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="socialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="60%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <linearGradient id="socialGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <linearGradient id="containerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2330" />
      <stop offset="100%" stop-color="#10131B" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#socialBg)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="320" cy="320" r="280" fill="#0A84FF" opacity="0.12" filter="blur(80px)" />

  <!-- LEFT: APP ICON SQUIRCLE HERO (Size 340x340 placed at x=150, y=150) -->
  <g transform="translate(150, 150)">
    <!-- Squircle container -->
    <rect width="340" height="340" rx="76" fill="url(#containerGrad)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" />

    <!-- Scaled Vector Artwork (340 / 1024 = 0.332) -->
    <g transform="scale(0.33203)">
      <!-- Outer Inactive Channel Arc -->
      <path d="M 160 304 A 560 560 0 0 1 720 864"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="40" stroke-linecap="round" />

      <!-- Concentric Inner Guideline Arc -->
      <path d="M 160 504 A 360 360 0 0 1 520 864"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="12" stroke-linecap="round" />

      <!-- Detents -->
      <g stroke="#FFFFFF" stroke-opacity="0.45" stroke-linecap="round">
        <line x1="160" y1="280" x2="160" y2="254" stroke-width="6" />
        <line x1="645" y1="584" x2="671" y2="569" stroke-width="5" />
        <line x1="556" y1="468" x2="584" y2="440" stroke-width="8" stroke="#00D2FF" stroke-opacity="0.9" />
        <line x1="440" y1="380" x2="455" y2="354" stroke-width="5" />
        <line x1="744" y1="864" x2="770" y2="864" stroke-width="6" />
      </g>

      <!-- Active Sweeping Sector -->
      <path d="M 160 304
               A 560 560 0 0 1 645 584
               L 472 684
               A 360 360 0 0 0 160 504
               Z"
            fill="url(#socialGlow)" />

      <!-- Focal Pip -->
      <circle cx="485" cy="539" r="28" fill="#FFFFFF" />
      <circle cx="485" cy="539" r="14" fill="#0A84FF" />

      <!-- Anchor Pin -->
      <circle cx="160" cy="864" r="120" fill="#0D0F14" stroke="url(#socialGlow)" stroke-width="16" />
      <circle cx="160" cy="864" r="56" fill="#00D2FF" />
      <circle cx="160" cy="864" r="24" fill="#FFFFFF" />
    </g>
  </g>

  <!-- RIGHT: BRAND TYPOGRAPHY & VALUE PROPOSITION -->
  <g transform="translate(560, 170)">
    <!-- Badge -->
    <rect x="0" y="0" width="150" height="28" rx="6" fill="#0A84FF" fill-opacity="0.18" stroke="#0A84FF" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="19"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
          font-size="11" font-weight="700" letter-spacing="2.5" fill="#00D2FF">macOS UTILITY</text>

    <!-- App Name -->
    <text x="0" y="100"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
          font-size="82" font-weight="800" letter-spacing="-1" fill="#FFFFFF">Stash</text>

    <!-- Tagline -->
    <text x="2" y="146"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
          font-size="24" font-weight="500" fill="#8E8E93">Tactile Corner Dials for macOS</text>

    <!-- Description -->
    <text x="2" y="196"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
          font-size="15" font-weight="400" fill="#AEAEB2">Zero-pixel hot corner gestures, per-monitor hardware</text>
    <text x="2" y="222"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
          font-size="15" font-weight="400" fill="#AEAEB2">brightness control, and monotonic Pomodoro focus timer.</text>

    <!-- Key Pills -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="144" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" />
      <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#F5F5F7">Hot Corners</text>

      <rect x="156" y="0" width="168" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" />
      <text x="174" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#F5F5F7">Multi-Display DDC</text>

      <rect x="336" y="0" width="144" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" />
      <text x="354" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#F5F5F7">Pomodoro</text>
    </g>
  </g>
</svg>
